[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novwr"
version = "0.6.0"
description = "Long-form novel writing engine with world-model-driven generation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.109.0",
    "httpx[socks]==0.28.1",
    "markdown-it-py>=4.0.0",
    "msgpack>=1.0.8",
    "openai>=1.50.0",
    "psycopg2-binary>=2.9.9",
    "pyahocorasick>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.22",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.36",
    "structlog>=24.1.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
novwr = "app.cli:main"

[dependency-groups]
desktop-build = [
    "maturin==1.9.6",
    "pyinstaller==6.16.0",
]
dev = [
    "hypothesis>=6.0.0",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = true
required-version = "==0.10.4"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core.indexing" = ["data/*.txt", "data/*.tsv"]

[tool.pytest.ini_options]
markers = [
    "e2e_llm: real provider end-to-end LLM tests",
]
